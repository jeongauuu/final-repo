name: Node.js GitOps CI/CD

on:
  push:
    branches: [ "main" ]
    paths: 
      - 'nodejs-app/**'
  workflow_dispatch: 

jobs:
  build-and-deploy: 
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4 

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './nodejs-app/package-lock.json'

      - name: Generate short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nodejs-app 
          file: ./nodejs-app/Dockerfile 
          push: true 
          tags: | 
            jeongau/final-nodejs-app:${{ steps.vars.outputs.sha }}  
            jeongau/final-nodejs-app:latest

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Update K8s manifest with new image tag
        # kustomization.yaml에 정의된 이미지를 새로 빌드한 SHA 태그로 교체합니다.
        run: kustomize edit set image jeongau/final-nodejs-app=jeongau/final-nodejs-app:${{ steps.vars.outputs.sha }}
        working-directory: ./argocd

      - name: Commit and push manifest changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./argocd/kustomization.yaml
          git commit -m "Update image tag to ${{ steps.vars.outputs.sha }}"
          git push